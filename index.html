<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>委辦計畫作業管理系統 Demo</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;font-family:"Microsoft JhengHei",Arial,sans-serif;color:#333;font-size:14px}
.banner{height:150px;overflow:hidden;background:#c5ecdf}
.banner img{width:100%;height:150px;object-fit:cover;display:block}
.topnav{height:45px;background:linear-gradient(90deg,#287fb4,#16a06e);display:flex;justify-content:center}
.topnav button{border:0;background:transparent;color:#fff;padding:0 18px;font-family:inherit;cursor:pointer}
.topnav .on{background:#e75e62}
.layout{display:grid;grid-template-columns:195px 1fr;gap:34px;padding:16px 18px 35px}
.left{border:1px solid #bbb;border-radius:8px 8px 0 0;box-shadow:0 1px 5px #bbb;overflow:hidden;align-self:start}
.left-title{background:#259792;color:#fff;font-weight:bold;padding:16px 14px}
.left button{width:100%;display:block;border:0;border-bottom:1px solid #ccc;background:#eee;text-align:left;padding:11px 13px;font-family:inherit;cursor:pointer}
.left button.active{background:#ddd}
.group{margin:15px 7px 0;background:#2bad9f;color:#fff;padding:14px 12px;font-weight:bold;display:flex;justify-content:space-between}
.main{min-width:0;padding-top:25px}
.page{display:none} .page.active{display:block}
.heading{display:flex;align-items:center;gap:13px;font-size:25px;margin-bottom:18px}
.heading:before{content:"";width:9px;height:28px;background:#15999c;border-radius:5px}
.heading .lines{height:20px;flex:1;border-top:1px solid #aaa;border-bottom:1px solid #bbb;position:relative}
.heading .lines:after{content:"";position:absolute;left:0;right:0;top:7px;border-top:1px solid #ccc}
.info{width:100%;border-collapse:collapse;margin-bottom:20px}
.info td{border:1px solid #ddd;padding:7px;background:#fff1f3}
.info .k{width:15%} .info .v{width:35%}
.link{color:#1774c7;text-decoration:underline}
.stage{color:#e93470}
.note{color:#ff5050;font-size:12px;line-height:1.55}
.video{color:#1774c7;font-size:12px;margin:0 0 7px 7px}
.toolbar{margin:7px 0 20px}
.plain{border:1px solid #ccc;background:#fff;color:#666;padding:7px 12px;border-radius:4px;font-family:inherit;cursor:pointer}
.plain:disabled,.action:disabled{opacity:.45;cursor:not-allowed}
.records{display:flex;gap:7px;margin-bottom:10px}
.rec{border:0;background:#ed5b5e;color:#fff;border-radius:5px;padding:10px 14px;font-family:inherit;cursor:pointer}
.rec.off{background:#ef8b8d}
.form{width:100%;border-collapse:collapse;border:1px solid #d2d2d2}
.form td{border:1px solid #d2d2d2;padding:8px;vertical-align:top}
.lab{width:15%;background:#e6ee79;color:#59621d}
.fld{background:#efefef} .white{background:#fff}
input,select{height:31px;border:1px solid #c8c8c8;border-radius:4px;background:#fff;padding:4px 8px;font:inherit}
input:disabled,select:disabled{background:#e3e3e3;color:#555}
.date{width:95px} .short{width:58px} .med{width:220px} .wide{width:340px}
.cal{display:inline-block;border:1px solid #bbb;background:#eee;padding:2px 5px;font-size:12px}
.money{width:100%;border-collapse:collapse}
.money th,.money td{border:1px solid #777;padding:5px}
.money th{background:#e6ee79;font-weight:normal;text-align:left}
.money td{background:#eee} .money td:nth-child(2),.money td:nth-child(3){text-align:right}
.actions{text-align:center!important;padding:15px!important;background:#fff!important}
.action{border:0;border-radius:3px;padding:8px 12px;color:#fff;font-family:inherit;cursor:pointer}
.blue{background:#5b96c5} .cyan{background:#47b6d1} .teal{background:#27a7a3}
.brown{width:100%;border-collapse:collapse} .brown th,.brown td{border:1px solid #ddd;padding:9px} .brown th{background:#d5b487;text-align:left}
.fold{color:#1976c8;cursor:pointer} .tri{display:inline-block;width:15px;height:15px;border-radius:50%;background:#77a500;color:#fff;line-height:14px;text-align:center;margin-right:4px}
.sub{width:100%;border-collapse:collapse;margin-top:7px} .sub th,.sub td{border:1px solid #d5d5d5;padding:7px} .sub th{background:#4f7fd0;color:#fff;text-align:left}
.hidden{display:none}
.resultrow td{background:#fff8e1!important}
.bottom{margin:18px 15px;color:#ff5050;font-size:12px;line-height:1.8}
@media(max-width:1200px){.layout{grid-template-columns:180px 1fr;gap:20px}.topnav button{padding:0 10px;font-size:13px}}
</style>



<style>
.date-picker-wrap{
  position:relative;
  display:inline-block;
  width:31px;
  height:25px;
  vertical-align:middle;
  margin-left:2px;
}
.date-picker-btn{
  width:31px;
  height:25px;
  border:1px solid #aaa;
  border-radius:2px;
  background:#eee;
  padding:0;
  line-height:23px;
  text-align:center;
  font-size:14px;
  color:#444;
  pointer-events:none;
}
.date-picker-native{
  position:absolute;
  inset:0;
  width:31px!important;
  min-width:31px!important;
  height:25px!important;
  padding:0!important;
  margin:0!important;
  opacity:0;
  cursor:pointer;
  border:0!important;
}
.date-picker-native:disabled{cursor:not-allowed}
.other-place{
  margin-top:7px;
  width:220px;
}
</style>

<style>
.context-bar{
  width:100%;
  border:1px solid #cfcfcf;
  background:#f7fbfb;
  margin:0 0 10px 0;
  padding:8px 10px;
  display:flex;
  gap:14px;
  flex-wrap:wrap;
  align-items:center;
  font-size:13px;
}
.context-item{
  display:inline-flex;
  align-items:center;
  gap:5px;
  padding-right:14px;
  border-right:1px solid #d5d5d5;
}
.context-item:last-child{border-right:0}
.context-key{color:#666}
.context-val{color:#0e6f7a;font-weight:700}
.context-main{
  display:inline-block;
  background:#ec5a5d;
  color:#fff;
  padding:5px 10px;
  border-radius:4px;
  font-weight:700;
}
</style>

<style>
.toast{
  position:fixed; top:165px; left:50%; transform:translateX(-50%);
  background:#2f9e75; color:#fff; padding:10px 18px; border-radius:4px;
  box-shadow:0 2px 10px rgba(0,0,0,.25); z-index:9999; display:none;
  font-size:14px;
}
.vendor-table{width:100%;border-collapse:collapse;margin-top:6px}
.vendor-table th,.vendor-table td{border:1px solid #d5d5d5;padding:8px}
.vendor-table th{background:#4f7fd0;color:#fff;text-align:left}
.vendor-table td:last-child{width:120px}
.contractor-search{padding:8px 0 2px}
.contractor-search label{margin-right:8px}
</style>

<style>
.stop-banner{margin:0 0 12px;border:1px solid #d9534f;background:#fff0f0;color:#a72626;padding:10px 12px;line-height:1.7;font-size:13px}
.stop-banner b{font-size:14px}
.secretary-badge{display:inline-block;min-width:20px;height:20px;padding:0 6px;line-height:20px;text-align:center;border-radius:10px;background:#d9534f;color:#fff;font-size:12px;margin-left:8px}
.secretary-panel{display:none;margin:8px 7px 0;border:1px solid #d9534f;background:#fff8f8;padding:10px;color:#a72626;font-size:12px;line-height:1.7}
</style>

<style>
.tender-lock-banner{
  margin:0 0 12px 0;
  padding:10px 12px;
  background:#fff4e5;
  border:1px solid #e0b36a;
  color:#8a5a14;
  line-height:1.7;
  font-size:13px;
}
.tender-lock-banner b{color:#a04d00}
</style>

<style>
.add-badge{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:22px;
  height:22px;
  padding:0 5px;
  margin-left:6px;
  border-radius:50%;
  background:#e60012;
  color:#fff;
  font-weight:700;
  font-size:12px;
  line-height:1;
  vertical-align:middle;
  box-shadow:0 1px 2px rgba(0,0,0,.18);
}
.add-badge.block{
  margin:0 6px 0 0;
  vertical-align:top;
}
.new-block-mark{
  position:relative;
}
.new-block-mark::before{
  content:"增";
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:22px;
  height:22px;
  margin-right:6px;
  border-radius:50%;
  background:#e60012;
  color:#fff;
  font-weight:700;
  font-size:12px;
  line-height:1;
}
</style>
</head>

const plan={name:"115年度農村水保署國際合作及多媒體資源整合計畫",no:"115WS002",kind:"整體性治山防災-綜合企劃與推廣",year:"115",owner:"農村規劃組 / 綜合企劃科 / 林奕豪 副工程司"};
let st={terminated:null,tenders:[{id:1,saved:false,caseNo:"",online:"",publish:"",deadline:"",openDate:"",place:""}],openings:[],evals:[],negs:[],cur:{tender:0,opening:0,eval:0,neg:0}};
const q=id=>document.getElementById(id);
const head=t=>`<div class="heading">${t}<div class="lines"></div></div>`;
const info=()=>`<table class="info"><tr><td class="k">計畫名稱：</td><td class="v"><span class="link">${plan.name}</span></td><td class="k">計畫編號：</td><td class="v">${plan.no}</td></tr><tr><td>計畫別：</td><td><b>${plan.kind}</b></td><td>計畫年度：</td><td>${plan.year}</td></tr><tr><td>主辦人員：</td><td>${plan.owner}</td><td>執行階段：</td><td class="stage">招標前置</td></tr></table>`;
const tabs=(type,arr,label)=>arr.length?`<div class="records">${arr.map((r,i)=>`<button class="rec ${st.cur[type]===i?"":"off"}" data-type="${type}" data-i="${i}">第${i+1}次${label}${addBadge()}</button>`).join("")}</div>`:"";
function bindTabs(){document.querySelectorAll(".rec").forEach(b=>b.onclick=()=>{st.cur[b.dataset.type]=+b.dataset.i;renderAll()})}
function page(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===p));document.querySelectorAll(".side").forEach(x=>x.classList.toggle("active",x.dataset.p===p));renderAll()}
document.querySelectorAll(".side").forEach(b=>b.onclick=()=>page(b.dataset.p));
document.addEventListener("click",e=>{if(e.target.closest("#secretaryGroup")){const p=q("secretaryPanel");if(p)p.style.display=p.style.display==="block"?"none":"block";}});

function placeOptions(selected){
  const list=["--請選擇--", "本署第一會議室", "本署第二會議室", "本署第三會議室", "本署府前辦公室第一會議室", "本署府前辦公室第二會議室", "本署府西辦公室資訊管理科討論室", "本署府西辦公室第二會議室", "本署府西辦公室第三會議室", "本署府西辦公室第四會議室", "本署府西辦公室第一會議室", "本署府西辦公室專題討論會議室", "本署慶豐小組會議室", "本署府西辦公室慶豐小組會議室", "本署府前辦公室第三會議室", "雲端會議室", "本署臺北辦公室1201會議室", "其它"];
  return list.map(x=>`<option value="${x}" ${x===selected?"selected":""}>${x}</option>`).join("");
}
function bindOtherPlaces(){
  document.querySelectorAll("select[data-place-select]").forEach(sel=>{
    const targetId=sel.dataset.otherTarget;
    const other=document.getElementById(targetId);
    if(!other) return;
    const sync=()=>{
      const show=sel.value==="其它";
      other.classList.toggle("hidden",!show);
      if(!show && !sel.disabled) other.value="";
    };
    sel.addEventListener("change",sync);
    sync();
  });
}

function cal(disabled=false){
  return `<span class="date-picker-wrap">
    <button type="button" class="date-picker-btn" aria-hidden="true">📅</button>
    <input type="date" class="date-picker-native" ${disabled?'disabled':''} title="選擇日期">
  </span>`;
}
function rocToAD(v){
  if(!v) return "";
  const m=v.trim().match(/^(\d{2,3})\/(\d{1,2})\/(\d{1,2})$/);
  if(!m) return "";
  return `${Number(m[1])+1911}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
}
function adToROC(v){
  if(!v) return "";
  const m=v.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return "";
  return `${Number(m[1])-1911}/${m[2]}/${m[3]}`;
}
function bindDatePickers(){
  document.querySelectorAll('.date-picker-native').forEach(p=>{
    const wrap=p.closest('.date-picker-wrap');
    const prev=wrap ? wrap.previousElementSibling : null;
    if(!prev || !prev.classList.contains('date')) return;
    p.value=rocToAD(prev.value);
    p.disabled=prev.disabled;
    p.addEventListener('change',()=>{
      prev.value=adToROC(p.value);
      prev.dispatchEvent(new Event('input',{bubbles:true}));
      prev.dispatchEvent(new Event('change',{bubbles:true}));
    });
    prev.addEventListener('change',()=>{p.value=rocToAD(prev.value)});
  });
}

function showToast(msg){
  let t=document.getElementById("toast");
  if(!t){
    t=document.createElement("div");
    t.id="toast"; t.className="toast";
    document.body.appendChild(t);
  }
  t.textContent=msg;
  t.style.display="block";
  clearTimeout(window.__toastTimer);
  window.__toastTimer=setTimeout(()=>t.style.display="none",2200);
}




function addBadge(){

function tenderLockReason(t){
  if(!t) return "";
  const o=st.openings.find(x=>x.tender===t.id);
  if(o && o.saved && o.result==="fail"){
    return `第${o.id}次開標作業為「流標／無法決標」`;
  }

  const e=o && st.evals.find(x=>x.opening===o.id);
  if(e && e.saved && e.result==="fail" && e.next==="retender"){
    return `第${e.id}次評選作業為「未達及格分數」，後續選擇「重新辦理招標作業」`;
  }

  const n=e && st.negs.find(x=>x.eval===e.id);
  if(n && n.saved && n.result==="fail" && n.next==="retender"){
    return `第${n.id}次議價作業為「無決標廠商」，後續選擇「重新辦理招標作業」`;
  }

  if(o && st.tenders.some(x=>x.fromO===o.id)){
    return `第${o.id}次開標作業已流標，且已建立下一次招標`;
  }
  if(e && st.tenders.some(x=>x.fromE===e.id)){
    return `第${e.id}次評選作業未通過，且已建立下一次招標`;
  }
  if(n && st.tenders.some(x=>x.fromN===n.id)){
    return `第${n.id}次議價作業無決標，且已建立下一次招標`;
  }
  return "";
}
function tenderLockBanner(t){
  const reason=tenderLockReason(t);
  if(!reason) return "";
  return `<div class="tender-lock-banner">
    ${addBadge()} <b>本次招標作業已鎖定，不可再修改。</b><br>
    原因：${reason}<br>
    請使用上方「新增記錄」建立下一次招標作業。
  </div>`;
}

function isTenderLocked(t){
  if(!t) return true;
  if(isCaseLocked()) return true;

  const o=st.openings.find(x=>x.tender===t.id);
  if(o && o.saved && o.result==="fail") return true;

  const e=o && st.evals.find(x=>x.opening===o.id);
  if(e && e.saved && e.result==="fail" && e.next==="retender") return true;

  const n=e && st.negs.find(x=>x.eval===e.id);
  if(n && n.saved && n.result==="fail" && n.next==="retender") return true;

  if(o && st.tenders.some(x=>x.fromO===o.id)) return true;
  if(e && st.tenders.some(x=>x.fromE===e.id)) return true;
  if(n && st.tenders.some(x=>x.fromN===n.id)) return true;

  return false;
}

function canTender(){
  if(isCaseLocked()) return false;
  const failedOpening = st.openings.find(o =>
    o.saved && o.result==="fail" &&
    !st.tenders.some(t=>t.fromO===o.id)
  );
  const failedEval = st.evals.find(e =>
    e.saved && e.result==="fail" && e.next==="retender" &&
    !st.tenders.some(t=>t.fromE===e.id)
  );
  const failedNeg = st.negs.find(n =>
    n.saved && n.result==="fail" && n.next==="retender" &&
    !st.tenders.some(t=>t.fromN===n.id)
  );
  return !!(failedOpening || failedEval || failedNeg);
}
